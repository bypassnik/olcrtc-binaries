name: Sync olcrtc binaries

on:
  schedule:
    # 03:30 UTC daily (after typical upstream nightly)
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Mirror latest CLI binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync from upstream Actions
        env:
          # Mirror releases: default token. Upstream artifact download needs a PAT
          # (Actions artifacts are not readable cross-repo with GITHUB_TOKEN alone).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
          UPSTREAM_REPO: openlibrecommunity/olcrtc
          MIRROR_REPO: ${{ github.repository }}
        run: |
          if [ -z "${UPSTREAM_TOKEN}" ]; then
            echo "Set repository secret UPSTREAM_TOKEN (PAT with public_repo) to download upstream Actions artifacts." >&2
            exit 1
          fi
          chmod +x scripts/sync-from-upstream.sh
          ./scripts/sync-from-upstream.sh
